documentation:
  - changed-files:
      - any-glob-to-any-file: "docs/**"
      - any-glob-to-any-file: "**/*.md"

backend:
  - changed-files:
      - any-glob-to-any-file: "src/main/java/**"
      - any-glob-to-any-file: "src/test/java/**"
      - any-glob-to-any-file: "pom.xml"

frontend:
  - changed-files:
      - any-glob-to-any-file: "src/main/resources/templates/**"
      - any-glob-to-any-file: "src/main/resources/static/**"

database:
  - changed-files:
      - any-glob-to-any-file: "docs/db/**"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"
      - any-glob-to-any-file: ".github/dependabot.yml"

docker:
  - changed-files:
      - any-glob-to-any-file: "Dockerfile"
      - any-glob-to-any-file: "docker-compose.yml"
