<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${titulo}">Gastos</title>
    <style>
        body { font-family: Arial, sans-serif; color: #102033; margin: 0; padding: 24px; background: #f5f7fb; }
        .sheet { background: #ffffff; border: 1px solid #dbe4ee; border-radius: 18px; padding: 24px; }
        .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; border-bottom: 2px solid #e7edf5; padding-bottom: 16px; margin-bottom: 18px; }
        .eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: #4b647f; margin: 0 0 6px; }
        h1 { margin: 0; font-size: 28px; }
        .subtitle { margin: 6px 0 0; color: #607387; }
        .summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 18px 0 24px; }
        .card { border: 1px solid #dfe8f2; border-radius: 14px; padding: 14px 16px; background: #fbfdff; }
        .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #6b7f92; margin: 0 0 4px; }
        .value { font-size: 18px; font-weight: 700; margin: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { border-bottom: 1px solid #e6edf5; text-align: left; padding: 10px 8px; font-size: 12px; vertical-align: top; }
        th { background: #f2f6fb; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #586b7e; }
        .muted { color: #617488; }
        .right { text-align: right; }
    </style>
</head>
<body>
<div class="sheet">
    <div class="header">
        <div>
            <p class="eyebrow">FlacoFitness / Finanzas</p>
            <h1 th:text="${titulo}">Gastos operativos</h1>
            <p class="subtitle" th:text="${subtitulo}">Listado financiero interno.</p>
        </div>
        <div class="muted">
            <div th:text="${#dates.format(#dates.createNow(), 'dd/MM/yyyy HH:mm')}">Fecha</div>
        </div>
    </div>

    <div class="summary">
        <div class="card">
            <p class="label">Gastos activos</p>
            <p class="value" th:text="${gastosTotales}">0</p>
        </div>
        <div class="card">
            <p class="label">Gasto del mes</p>
            <p class="value" th:text="${#numbers.formatDecimal(gastoMesActual, 1, 'POINT', 2, 'COMMA') + ' EUR'}">0.00 EUR</p>
        </div>
        <div class="card">
            <p class="label">Balance del mes</p>
            <p class="value" th:text="${#numbers.formatDecimal(balanceMesActual, 1, 'POINT', 2, 'COMMA') + ' EUR'}">0.00 EUR</p>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>Fecha</th>
            <th>Concepto</th>
            <th>Categoria</th>
            <th>Relacion</th>
            <th class="right">Importe</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="gasto : ${gastos}">
            <td th:text="${gasto.fecha != null ? #temporals.format(gasto.fecha, 'dd/MM/yyyy') : '-'}">-</td>
            <td>
                <div th:text="${gasto.concepto}">Concepto</div>
                <div class="muted" th:text="${#strings.defaultString(gasto.proveedor, 'Sin proveedor')}">Proveedor</div>
            </td>
            <td th:text="${gasto.categoria != null ? #strings.replace(gasto.categoria.name(), '_', ' ') : '-'}">Categoria</td>
            <td class="muted">
                <span th:if="${gasto.staffResponsable != null}" th:text="${'Staff: ' + gasto.staffResponsable.usuario.nombre}">Staff</span>
                <span th:if="${gasto.maquina != null}"><br th:if="${gasto.staffResponsable != null}"/>Maquina: <span th:text="${gasto.maquina.nombre}">Maquina</span></span>
                <span th:if="${gasto.material != null}"><br th:if="${gasto.staffResponsable != null or gasto.maquina != null}"/>Material: <span th:text="${gasto.material.nombre}">Material</span></span>
                <span th:if="${gasto.staffResponsable == null and gasto.maquina == null and gasto.material == null}">General</span>
            </td>
            <td class="right" th:text="${gasto.importe != null ? #numbers.formatDecimal(gasto.importe, 1, 'POINT', 2, 'COMMA') + ' EUR' : '-'}">0.00 EUR</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
