<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${titulo}">Nóminas</title>
    <style>
        body { font-family: Arial, sans-serif; color: #102033; margin: 0; padding: 24px; background: #f5f7fb; }
        .sheet { background: #ffffff; border: 1px solid #dbe4ee; border-radius: 18px; padding: 24px; }
        .header { border-bottom: 2px solid #e7edf5; padding-bottom: 16px; margin-bottom: 18px; }
        .eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: 11px; color: #4b647f; margin: 0 0 6px; }
        h1 { margin: 0; font-size: 28px; }
        .subtitle { margin: 6px 0 0; color: #607387; }
        .summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 18px 0 24px; }
        .card { border: 1px solid #dfe8f2; border-radius: 14px; padding: 14px 16px; background: #fbfdff; }
        .label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #6b7f92; margin: 0 0 4px; }
        .value { font-size: 18px; font-weight: 700; margin: 0; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { border-bottom: 1px solid #e6edf5; text-align: left; padding: 10px 8px; font-size: 12px; vertical-align: top; }
        th { background: #f2f6fb; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #586b7e; }
        .muted { color: #617488; }
        .right { text-align: right; }
    </style>
</head>
<body>
<div class="sheet">
    <div class="header">
        <p class="eyebrow">FlacoFitness / Finanzas</p>
        <h1 th:text="${titulo}">Nóminas internas</h1>
        <p class="subtitle" th:text="${subtitulo}">Cierres salariales internos.</p>
    </div>

    <div class="summary">
        <div class="card">
            <p class="label">Nóminas pendientes</p>
            <p class="value" th:text="${nominasPendientes}">0</p>
        </div>
        <div class="card">
            <p class="label">Total neto</p>
            <p class="value" th:text="${#numbers.formatDecimal(totalNeto, 1, 'POINT', 2, 'COMMA') + ' EUR'}">0.00 EUR</p>
        </div>
    </div>

    <table>
        <thead>
        <tr>
            <th>Periodo</th>
            <th>Staff</th>
            <th>Estado</th>
            <th class="right">Base</th>
            <th class="right">Bonus</th>
            <th class="right">Deducciones</th>
            <th class="right">Neto</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="nomina : ${nominas}">
            <td>
                <div th:text="${nomina.periodo}">2026-01</div>
                <div class="muted" th:text="${nomina.referencia}">REF</div>
            </td>
            <td th:text="${nomina.staffPerfil != null and nomina.staffPerfil.usuario != null ? nomina.staffPerfil.usuario.nombre : '-'}">Staff</td>
            <td th:text="${nomina.estado != null ? #strings.replace(nomina.estado.name(), '_', ' ') : '-'}">Estado</td>
            <td class="right" th:text="${#numbers.formatDecimal(nomina.salarioBase, 1, 'POINT', 2, 'COMMA') + ' EUR'}">0.00 EUR</td>
            <td class="right" th:text="${#numbers.formatDecimal(nomina.bonus, 1, 'POINT', 2, 'COMMA') + ' EUR'}">0.00 EUR</td>
            <td class="right" th:text="${#numbers.formatDecimal(nomina.deducciones, 1, 'POINT', 2, 'COMMA') + ' EUR'}">0.00 EUR</td>
            <td class="right" th:text="${#numbers.formatDecimal(nomina.salarioNeto, 1, 'POINT', 2, 'COMMA') + ' EUR'}">0.00 EUR</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
