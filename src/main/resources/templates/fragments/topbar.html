<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="ff-topbar" th:fragment="topbar(pageTitle, pageHint)">

    <!-- Left: hamburger (mobile) + page title -->
    <div class="d-flex align-items-center gap-3">
        <button class="btn ff-icon-button d-lg-none" type="button"
                data-bs-toggle="offcanvas" data-bs-target="#appSidebar"
                aria-controls="appSidebar" aria-label="Abrir menú">
            <span class="ff-hamburger"></span>
        </button>
        <div class="ff-topbar-info">
            <span class="ff-topbar-eyebrow">Panel operativo</span>
            <h1 class="ff-topbar-title" th:text="${pageTitle}">Panel</h1>
        </div>
    </div>

    <!-- Center: Search bar -->
    <div class="ff-topbar-search d-none d-md-flex">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="topbarSearch" placeholder="Buscar en el panel..." autocomplete="off">
    </div>

    <!-- Right: actions -->
    <div class="ff-topbar-actions">
        <!-- Notifications -->
        <button class="ff-topbar-btn" type="button" aria-label="Notificaciones" title="Notificaciones">
            <span class="ff-notif-badge" aria-hidden="true"></span>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
        </button>

        <!-- User avatar -->
        <div class="ff-topbar-avatar-btn">
            <div class="ff-topbar-avatar">AD</div>
            <span class="ff-topbar-avatar-name">Admin</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                 style="color: var(--ff-text-soft)">
                <polyline points="6 9 12 15 18 9"/>
            </svg>
        </div>
    </div>

</header>
</body>
</html>
