<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${modoEdicion} ? 'Editar membresia' : 'Nueva membresia')}"></head>
<body class="ff-app">
<div class="ff-app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('membresias')}"></div>
    <div class="ff-main">
        <div th:replace="~{fragments/topbar :: topbar(${modoEdicion} ? 'Editar membresia' : 'Nueva membresia', 'Catalogo comercial.')}"></div>
        <main class="ff-content">
            <div class="ff-content-stack">
                <section class="ff-section-header"><div><span class="ff-section-eyebrow">Membresias</span><h2 class="ff-section-title" th:text="${modoEdicion} ? 'Editar plan' : 'Crear plan'">Crear plan</h2><p class="ff-section-subtitle">Define la oferta que despues se contrata por usuario.</p></div><a class="btn btn-outline-secondary" th:href="@{/membresias}">Volver</a></section>
                <form class="ff-surface-card" th:object="${plan}" th:action="${modoEdicion} ? @{/membresias/{id}(id=${plan.id})} : @{/membresias}" method="post">
                    <div class="ff-card-body">
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label" for="nombre">Nombre</label><input id="nombre" class="form-control" th:field="*{nombre}"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div></div>
                            <div class="col-md-6"><label class="form-label" for="tipoMembresia">Tipo</label><select id="tipoMembresia" class="form-select" th:field="*{tipoMembresia}"><option th:each="tipo : ${tiposMembresia}" th:value="${tipo}" th:text="${#strings.replace(tipo.name(), '_', ' ')}">Tipo</option></select></div>
                            <div class="col-md-4"><label class="form-label" for="precioMensual">Precio</label><input id="precioMensual" type="number" step="0.01" min="0" class="form-control" th:field="*{precioMensual}"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('precioMensual')}" th:errors="*{precioMensual}"></div></div>
                            <div class="col-md-4"><label class="form-label" for="duracionDias">Duracion dias</label><input id="duracionDias" type="number" min="1" class="form-control" th:field="*{duracionDias}"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('duracionDias')}" th:errors="*{duracionDias}"></div></div>
                            <div class="col-md-4 d-flex align-items-end"><div class="form-check form-switch mb-2"><input id="activo" type="checkbox" class="form-check-input" th:field="*{activo}"><label class="form-check-label" for="activo">Activa</label></div></div>
                            <div class="col-12"><label class="form-label" for="descripcion">Descripcion</label><textarea id="descripcion" rows="3" class="form-control" th:field="*{descripcion}"></textarea></div>
                            <div class="col-12"><label class="form-label" for="beneficios">Beneficios</label><textarea id="beneficios" rows="3" class="form-control" th:field="*{beneficios}" placeholder="Acceso libre, clases incluidas, seguimiento..."></textarea></div>
                        </div>
                    </div>
                    <div class="ff-form-actions"><p class="ff-form-actions-note">El precio del pago se deriva de esta membresia.</p><div class="d-flex gap-2"><button class="btn btn-success" type="submit">Guardar</button><a class="btn btn-outline-secondary" th:href="@{/membresias}">Cancelar</a></div></div>
                </form>
                <div th:replace="~{fragments/footer :: footer}"></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
