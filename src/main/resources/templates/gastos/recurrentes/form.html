<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Recurrente')}"></head>
<body class="ff-app">
<div class="ff-app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('recurrentes')}"></div>

    <div class="ff-main">
        <div th:replace="~{fragments/topbar :: topbar('Recurrente', 'Plantilla de cargo automatico.')}"></div>

        <main class="ff-content">
            <div class="ff-content-stack">
                <div th:replace="~{fragments/alerts :: alerts(${mensajeExito}, ${mensajeError})}"></div>

                <section class="ff-section-header ff-animate-in">
                    <div>
                        <span class="ff-section-eyebrow">Finanzas</span>
                        <h2 class="ff-section-title" th:text="${modoEdicion ? 'Editar plantilla recurrente' : 'Nueva plantilla recurrente'}">Nueva plantilla recurrente</h2>
                        <p class="ff-section-subtitle">Deja automatizado el cargo y su relacion operativa.</p>
                    </div>
                </section>

                <section class="ff-surface-card ff-animate-in">
                    <div class="ff-card-body">
                        <form th:action="${modoEdicion ? '/gastos/recurrentes/' + recurrente.id : '/gastos/recurrentes'}" th:object="${recurrente}" method="post" class="row g-3">
                            <div class="col-md-8">
                                <label class="form-label" for="concepto">Concepto</label>
                                <input id="concepto" type="text" class="form-control" th:field="*{concepto}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="categoria">Categoria</label>
                                <select id="categoria" class="form-select" th:field="*{categoria}" required>
                                    <option value="">Selecciona...</option>
                                    <option th:each="cat : ${categoriasGasto}" th:value="${cat}" th:text="${#strings.replace(cat.name(), '_', ' ')}">Categoria</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="tipoGasto">Tipo</label>
                                <select id="tipoGasto" class="form-select" th:field="*{tipoGasto}" required>
                                    <option value="">Selecciona...</option>
                                    <option th:each="tipo : ${tiposGasto}" th:value="${tipo}" th:text="${#strings.replace(tipo.name(), '_', ' ')}">Tipo</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="frecuencia">Frecuencia</label>
                                <select id="frecuencia" class="form-select" th:field="*{frecuencia}" required>
                                    <option value="">Selecciona...</option>
                                    <option th:each="freq : ${frecuenciasGasto}" th:value="${freq}" th:text="${#strings.replace(freq.name(), '_', ' ')}">Frecuencia</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="importe">Importe</label>
                                <input id="importe" type="number" step="0.01" min="0.01" class="form-control" th:field="*{importe}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="fechaInicio">Fecha inicio</label>
                                <input id="fechaInicio" type="date" class="form-control" th:field="*{fechaInicio}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="fechaProximoCargo">Pr&oacute;ximo cargo</label>
                                <input id="fechaProximoCargo" type="date" class="form-control" th:field="*{fechaProximoCargo}" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="proveedor">Proveedor</label>
                                <input id="proveedor" type="text" class="form-control" th:field="*{proveedor}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="staffResponsable">Staff responsable</label>
                                <select id="staffResponsable" class="form-select" th:field="*{staffResponsable.id}">
                                    <option value="">Sin relacion</option>
                                    <option th:each="staff : ${staffActivos}" th:value="${staff.id}" th:text="${staff.usuario.nombre + (staff.usuario.apellidos != null and !staff.usuario.apellidos.isBlank() ? ' ' + staff.usuario.apellidos : '')}">Staff</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="maquina">Maquina relacionada</label>
                                <select id="maquina" class="form-select" th:field="*{maquina.id}">
                                    <option value="">Sin relacion</option>
                                    <option th:each="maquina : ${maquinasActivas}" th:value="${maquina.id}" th:text="${maquina.nombre}">Maquina</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label" for="material">Material relacionado</label>
                                <select id="material" class="form-select" th:field="*{material.id}">
                                    <option value="">Sin relacion</option>
                                    <option th:each="material : ${materialesActivos}" th:value="${material.id}" th:text="${material.nombre}">Material</option>
                                </select>
                            </div>
                            <div class="col-md-4 d-flex align-items-center gap-2 mt-4">
                                <input id="activo" type="checkbox" class="form-check-input" th:field="*{activo}">
                                <label class="form-check-label" for="activo">Activa</label>
                            </div>
                            <div class="col-12">
                                <label class="form-label" for="observaciones">Observaciones</label>
                                <textarea id="observaciones" rows="4" class="form-control" th:field="*{observaciones}"></textarea>
                            </div>
                            <div class="col-12 d-flex gap-2">
                                <button type="submit" class="btn btn-success">Guardar</button>
                                <a class="btn btn-outline-secondary" th:href="@{/gastos/recurrentes}">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </section>

                <div th:replace="~{fragments/footer :: footer}"></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
