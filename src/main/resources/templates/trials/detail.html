<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Detalle trial')}"></head>
<body class="ff-app">
<div class="ff-app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('trials')}"></div>
    <div class="ff-main">
        <div th:replace="~{fragments/topbar :: topbar('Detalle trial', 'Seguimiento comercial.')}"></div>
        <main class="ff-content">
            <div class="ff-content-stack">
                <div th:replace="~{fragments/alerts :: alerts(${mensajeExito}, ${mensajeError})}"></div>

                <!-- Header -->
                <section class="ff-section-header ff-animate-in">
                    <div>
                        <span class="ff-section-eyebrow">Trial</span>
                        <h1 class="ff-section-title"
                           th:text="${trial.nombre + (trial.apellidos != null && !trial.apellidos.isBlank() ? ' ' + trial.apellidos : '')}">Trial</h1>
                        <p class="ff-section-subtitle"
                           th:text="${trial.fechaPrueba != null ? 'Prueba el ' + #temporals.format(trial.fechaPrueba, 'dd/MM/yyyy') : 'Dia de prueba pendiente'}">Prueba</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-secondary" th:href="@{/trials}">Volver</a>
                        <a class="btn btn-success" th:href="@{/trials/{id}/editar(id=${trial.id})}">Editar</a>
                    </div>
                </section>

                <!-- Content -->
                <section class="row g-4 ff-animate-in">
                    <div class="col-lg-8">
                        <article class="ff-surface-card">
                            <div class="ff-card-header">
                                <div>
                                    <p class="ff-section-eyebrow mb-0">Información</p>
                                    <h3 class="ff-card-title mt-1">Datos comerciales</h3>
                                </div>
                            </div>
                            <div class="ff-card-body pt-0">
                                <div class="ff-detail-grid">
                                    <div class="ff-detail-item">
                                        <span class="ff-detail-label">Email</span>
                                        <strong class="ff-detail-value" th:text="${#strings.defaultString(trial.email, '-')}">email</strong>
                                    </div>
                                    <div class="ff-detail-item">
                                        <span class="ff-detail-label">Teléfono</span>
                                        <strong class="ff-detail-value" th:text="${#strings.defaultString(trial.telefono, '-')}">telefono</strong>
                                    </div>
                                    <div class="ff-detail-item">
                                        <span class="ff-detail-label">Origen</span>
                                        <strong class="ff-detail-value" th:text="${#strings.defaultString(trial.origen, '-')}">origen</strong>
                                    </div>
                                    <div class="ff-detail-item">
                                        <span class="ff-detail-label">Estado</span>
                                        <span class="ff-status-badge"
                                              th:classappend="${trial.estado != null && trial.estado.name() == 'CONVERTIDO'} ? ' ff-status-active' : (${trial.estado != null && trial.estado.name() == 'NO_ASISTIO'} ? ' ff-status-inactive' : ' ff-status-pending')"
                                              th:text="${trial.estado}">estado</span>
                                    </div>
                                    <div class="ff-detail-item">
                                        <span class="ff-detail-label">Staff responsable</span>
                                        <strong class="ff-detail-value" th:text="${trial.staffResponsable != null and trial.staffResponsable.usuario != null ? trial.staffResponsable.usuario.nombre : '-'}">staff</strong>
                                    </div>
                                    <div class="ff-detail-item ff-detail-item-wide">
                                        <span class="ff-detail-label">Observaciones</span>
                                        <strong class="ff-detail-value" th:text="${#strings.defaultString(trial.observaciones, 'Sin observaciones')}">obs</strong>
                                    </div>
                                </div>
                            </div>
                        </article>
                    </div>

                    <div class="col-lg-4">
                        <article class="ff-surface-card">
                            <div class="ff-card-header">
                                <div>
                                    <p class="ff-section-eyebrow mb-0">Operativa</p>
                                    <h3 class="ff-card-title mt-1">Acciones</h3>
                                </div>
                            </div>
                            <div class="ff-card-body pt-0 d-flex flex-column gap-3">
                                <form th:if="${trial.estado == null or trial.estado.name() != 'CONVERTIDO'}"
                                      th:action="@{/trials/{id}/convertir(id=${trial.id})}"
                                      method="post">
                                    <button class="btn btn-success w-100" type="submit">
                                        <i class="fa-solid fa-user-plus me-1"></i> Convertir a usuario
                                    </button>
                                </form>

                                <a th:if="${trial.usuarioConvertido != null}"
                                   class="btn btn-outline-success w-100"
                                   th:href="@{/usuarios/{id}(id=${trial.usuarioConvertido.id})}">
                                    <i class="fa-solid fa-arrow-up-right-from-square me-1"></i> Abrir usuario
                                </a>

                                <div class="border-top pt-3" th:if="${trial.estado != null && trial.estado.name() != 'CONVERTIDO'}">
                                    <p class="ff-card-subtitle mb-2">Cambiar estado</p>
                                    <form th:action="@{/trials/{id}/estado(id=${trial.id})}"
                                          method="post"
                                          class="d-flex gap-2">
                                        <select class="form-select form-select-sm" name="estado">
                                            <option th:each="estado : ${T(com.flacofitness.app.model.enums.EstadoTrial).values()}"
                                                    th:value="${estado}"
                                                    th:text="${estado}"
                                                    th:selected="${trial.estado == estado}">Estado</option>
                                        </select>
                                        <button class="btn btn-sm btn-outline-secondary" type="submit">Aplicar</button>
                                    </form>
                                </div>
                            </div>
                        </article>
                    </div>
                </section>

                <div th:replace="~{fragments/footer :: footer}"></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
