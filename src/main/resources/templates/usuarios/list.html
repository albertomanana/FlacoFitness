<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Usuarios')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <h1 class="mb-1">Usuarios</h1>
            <p class="text-muted mb-0">Gestión de usuarios registrados en FlacoFitness.</p>
        </div>
        <a class="btn btn-success" th:href="@{/usuarios/nuevo}">Nuevo usuario</a>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensajeExito}">Operación completada correctamente.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Email</th>
                        <th>Rol</th>
                        <th>Plan</th>
                        <th>Activo</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody th:if="${not #lists.isEmpty(usuarios)}">
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.nombre}">Nombre</td>
                        <td th:text="${#strings.defaultString(usuario.apellidos, '-')}">Apellidos</td>
                        <td th:text="${usuario.email}">correo@ejemplo.com</td>
                        <td th:text="${usuario.rol != null ? usuario.rol.nombre : '-'}">Rol</td>
                        <td th:text="${usuario.plan != null ? usuario.plan.nombre : '-'}">Plan</td>
                        <td>
                            <span th:if="${usuario.activo}" class="badge text-bg-success">Sí</span>
                            <span th:unless="${usuario.activo}" class="badge text-bg-secondary">No</span>
                        </td>
                        <td class="text-end">
                            <div class="d-inline-flex gap-2 flex-wrap justify-content-end">
                                <a class="btn btn-outline-secondary btn-sm"
                                   th:href="@{/usuarios/{id}(id=${usuario.id})}">
                                    Ver
                                </a>
                                <a class="btn btn-outline-success btn-sm"
                                   th:href="@{/usuarios/{id}/editar(id=${usuario.id})}">
                                    Editar
                                </a>
                                <form th:if="${usuario.activo}" th:action="@{/usuarios/{id}/desactivar(id=${usuario.id})}"
                                      method="post" class="d-inline">
                                    <button type="submit" class="btn btn-outline-danger btn-sm"
                                            onclick="return confirm('¿Deseas desactivar este usuario?');">
                                        Desactivar
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                    <tbody th:if="${#lists.isEmpty(usuarios)}">
                    <tr>
                        <td colspan="7" class="text-center text-muted py-4">
                            Todavía no hay usuarios registrados.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
