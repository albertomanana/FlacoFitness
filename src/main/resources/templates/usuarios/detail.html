<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Detalle de usuario')}"></head>
<body class="ff-app">
<div class="ff-app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('usuarios')}"></div>

    <div class="ff-main">
        <div th:replace="~{fragments/topbar :: topbar('Detalle de usuario', 'Consulta completa de la ficha del usuario seleccionado.')}"></div>

        <main class="ff-content">
            <div class="ff-content-stack">
                <section class="ff-section-header">
                    <div>
                        <span class="ff-section-eyebrow">Consulta</span>
                        <h2 class="ff-section-title" th:text="${usuario.nombre + (usuario.apellidos != null && !usuario.apellidos.isBlank() ? ' ' + usuario.apellidos : '')}">Usuario</h2>
                        <p class="ff-section-subtitle">Informacion personal, rol, plan y estado actual dentro del sistema.</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a class="btn btn-success" th:href="@{/usuarios/{id}/editar(id=${usuario.id})}">Editar</a>
                        <a class="btn btn-outline-secondary" th:href="@{/usuarios}">Volver</a>
                    </div>
                </section>

                <section class="row justify-content-center">
                    <div class="col-12 col-xl-10">
                        <div class="ff-surface-card">
                            <div class="ff-card-body">
                                <dl class="row mb-0 ff-detail-list">
                                    <dt class="col-sm-3">Nombre</dt>
                                    <dd class="col-sm-9" th:text="${usuario.nombre}">Nombre</dd>

                                    <dt class="col-sm-3">Apellidos</dt>
                                    <dd class="col-sm-9" th:text="${#strings.defaultString(usuario.apellidos, '-')}">Apellidos</dd>

                                    <dt class="col-sm-3">Email</dt>
                                    <dd class="col-sm-9" th:text="${usuario.email}">correo@ejemplo.com</dd>

                                    <dt class="col-sm-3">Telefono</dt>
                                    <dd class="col-sm-9" th:text="${#strings.defaultString(usuario.telefono, '-')}">Telefono</dd>

                                    <dt class="col-sm-3">Fecha de nacimiento</dt>
                                    <dd class="col-sm-9"
                                        th:text="${usuario.fechaNacimiento != null ? #temporals.format(usuario.fechaNacimiento, 'dd/MM/yyyy') : '-'}">
                                        Fecha
                                    </dd>

                                    <dt class="col-sm-3">Direccion</dt>
                                    <dd class="col-sm-9" th:text="${#strings.defaultString(usuario.direccion, '-')}">Direccion</dd>

                                    <dt class="col-sm-3">Rol</dt>
                                    <dd class="col-sm-9" th:text="${usuario.rol != null ? usuario.rol.nombre : '-'}">Rol</dd>

                                    <dt class="col-sm-3">Plan</dt>
                                    <dd class="col-sm-9" th:text="${usuario.plan != null ? usuario.plan.nombre : '-'}">Plan</dd>

                                    <dt class="col-sm-3">Activo</dt>
                                    <dd class="col-sm-9">
                                        <span class="ff-status-badge"
                                              th:classappend="${usuario.activo} ? ' ff-status-active' : ' ff-status-inactive'"
                                              th:text="${usuario.activo} ? 'Activo' : 'Inactivo'">Activo</span>
                                    </dd>

                                    <dt class="col-sm-3">Fecha de registro</dt>
                                    <dd class="col-sm-9"
                                        th:text="${usuario.fechaRegistro != null ? #temporals.format(usuario.fechaRegistro, 'dd/MM/yyyy HH:mm') : '-'}">
                                        Fecha registro
                                    </dd>
                                </dl>
                            </div>
                        </div>
                    </div>
                </section>

                <div th:replace="~{fragments/footer :: footer}"></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
