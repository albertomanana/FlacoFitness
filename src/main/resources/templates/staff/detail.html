<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Detalle staff')}"></head>
<body class="ff-app">
<div class="ff-app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('staff')}"></div>
    <div class="ff-main">
        <div th:replace="~{fragments/topbar :: topbar('Detalle staff', 'Perfil operativo.')}"></div>
        <main class="ff-content">
            <div class="ff-content-stack">
                <div th:replace="~{fragments/alerts :: alerts(${mensajeExito}, ${mensajeError})}"></div>
                <section class="ff-section-header">
                    <div>
                        <span class="ff-section-eyebrow">Staff</span>
                        <h2 class="ff-section-title" th:text="${staffPerfil.usuario != null ? staffPerfil.usuario.nombre + (staffPerfil.usuario.apellidos != null && !staffPerfil.usuario.apellidos.isBlank() ? ' ' + staffPerfil.usuario.apellidos : '') : 'Staff'}">Staff</h2>
                        <p class="ff-section-subtitle" th:text="${staffPerfil.especialidad != null ? staffPerfil.especialidad : 'Perfil operativo'}">Perfil operativo</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-secondary" th:href="@{/staff}">Volver</a>
                        <a class="btn btn-success" th:href="@{/staff/{id}/editar(id=${staffPerfil.id})}">Editar</a>
                    </div>
                </section>
                <section class="row g-4">
                    <div class="col-lg-4">
                        <article class="ff-surface-card">
                            <div class="ff-card-body text-center">
                                <img class="ff-avatar-xl mb-3" th:src="${@userPhotoUrlResolver.resolvePhotoUrl(staffPerfil.usuario != null ? staffPerfil.usuario.fotoPath : null)}" alt="Avatar staff">
                                <h3 class="ff-card-title" th:text="${staffPerfil.usuario != null ? staffPerfil.usuario.nombre : 'Staff'}">Staff</h3>
                                <span class="ff-status-badge" th:classappend="${staffPerfil.activo == true} ? ' ff-status-active' : ' ff-status-inactive'" th:text="${staffPerfil.activo == true} ? 'Activo' : 'Inactivo'">Activo</span>
                            </div>
                        </article>
                    </div>
                    <div class="col-lg-8">
                        <article class="ff-surface-card">
                            <div class="ff-card-header"><h3 class="ff-card-title">Informacion operativa</h3></div>
                            <div class="ff-card-body">
                                <div class="ff-detail-grid">
                                    <div class="ff-detail-item"><span>Rol interno</span><strong th:text="${staffPerfil.rolStaff != null ? #strings.replace(staffPerfil.rolStaff.name(), '_', ' ') : '-'}">Rol</strong></div>
                                    <div class="ff-detail-item"><span>Clases y rutinas</span><strong th:text="${staffPerfil.puedeImpartirClases == true ? 'Autorizado' : 'No autorizado'}">Autorizado</strong></div>
                                    <div class="ff-detail-item"><span>Email</span><strong th:text="${staffPerfil.usuario != null ? staffPerfil.usuario.email : '-'}">email</strong></div>
                                    <div class="ff-detail-item"><span>Telefono</span><strong th:text="${staffPerfil.usuario != null ? #strings.defaultString(staffPerfil.usuario.telefono, '-') : '-'}">telefono</strong></div>
                                    <div class="ff-detail-item"><span>Fecha de alta</span><strong th:text="${staffPerfil.fechaAlta != null ? #temporals.format(staffPerfil.fechaAlta, 'dd/MM/yyyy') : '-'}">fecha</strong></div>
                                    <div class="ff-detail-item ff-detail-item-wide"><span>Observaciones</span><strong th:text="${#strings.defaultString(staffPerfil.observaciones, '-')}">obs</strong></div>
                                </div>
                            </div>
                        </article>
                    </div>
                </section>
                <div th:replace="~{fragments/footer :: footer}"></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
