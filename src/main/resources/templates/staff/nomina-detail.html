<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Detalle nómina')}"></head>
<body class="ff-app">
<div class="ff-app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('staff-nominas')}"></div>

    <div class="ff-main">
        <div th:replace="~{fragments/topbar :: topbar('Detalle nómina', 'Documento interno de consulta.')}"></div>

        <main class="ff-content">
            <div class="ff-content-stack ff-page-stack">
                <section class="ff-section-header">
                    <div>
                        <span class="ff-section-eyebrow">Nómina</span>
                        <h2 class="ff-section-title" th:text="${nomina.periodo}">2026-04</h2>
                        <p class="ff-section-subtitle mb-0" th:text="${nomina.referencia}">Referencia</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a class="btn btn-outline-secondary" th:href="@{/staff/nominas}">Mis nóminas</a>
                        <a class="btn btn-success"
                           target="_blank"
                           rel="noopener"
                           th:href="@{/staff/nominas/{id}/pdf(id=${nomina.id})}">
                            <i class="fa-solid fa-file-pdf me-1"></i> Descargar PDF
                        </a>
                    </div>
                </section>

                <section class="ff-surface-card">
                    <div class="ff-card-body">
                        <div class="row g-4">
                            <div class="col-md-4">
                                <span class="ff-stat-label">Staff</span>
                                <p class="fw-semibold mb-0" th:text="${nomina.staffPerfil.usuario.nombre}">Staff</p>
                                <p class="text-muted small mb-0" th:text="${nomina.staffPerfil.rolStaff}">Rol</p>
                            </div>
                            <div class="col-md-8">
                                <div class="row g-3">
                                    <div class="col-sm-6 col-lg-3">
                                        <span class="ff-stat-label">Salario base</span>
                                        <p class="fw-bold mb-0" th:text="${#numbers.formatDecimal(nomina.salarioBase, 1, 'POINT', 2, 'COMMA')} + ' EUR'">0 EUR</p>
                                    </div>
                                    <div class="col-sm-6 col-lg-3">
                                        <span class="ff-stat-label">Bonus</span>
                                        <p class="fw-bold mb-0" th:text="${#numbers.formatDecimal(nomina.bonus, 1, 'POINT', 2, 'COMMA')} + ' EUR'">0 EUR</p>
                                    </div>
                                    <div class="col-sm-6 col-lg-3">
                                        <span class="ff-stat-label">Deducciones</span>
                                        <p class="fw-bold text-danger mb-0" th:text="${#numbers.formatDecimal(nomina.deducciones, 1, 'POINT', 2, 'COMMA')} + ' EUR'">0 EUR</p>
                                    </div>
                                    <div class="col-sm-6 col-lg-3">
                                        <span class="ff-stat-label">Neto a cobrar</span>
                                        <p class="fw-bold text-success fs-5 mb-0" th:text="${#numbers.formatDecimal(nomina.salarioNeto, 1, 'POINT', 2, 'COMMA')} + ' EUR'">0 EUR</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <div th:replace="~{fragments/footer :: footer}"></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
