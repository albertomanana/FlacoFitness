<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Mis nóminas')}"></head>
<body class="ff-app">
<div class="ff-app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('staff-nominas')}"></div>

    <div class="ff-main">
        <div th:replace="~{fragments/topbar :: topbar('Mis nóminas', 'Consulta privada de nóminas del staff.')}"></div>

        <main class="ff-content">
            <div class="ff-content-stack ff-page-stack">
                <div th:replace="~{fragments/alerts :: alerts(${mensajeExito}, ${mensajeError})}"></div>

                <section class="ff-section-header">
                    <div>
                        <span class="ff-section-eyebrow">Staff</span>
                        <h1 class="ff-section-title">Mis nóminas</h1>
                        <p class="ff-section-subtitle mb-0">Solo se muestran las nóminas asociadas a tu perfil.</p>
                    </div>
                    <a class="btn btn-outline-secondary" th:href="@{/staff/dashboard}">Volver al panel</a>
                </section>

                <section class="ff-surface-card">
                    <div class="table-responsive">
                        <table class="table ff-table">
                            <thead>
                                <tr>
                                    <th>Periodo</th>
                                    <th>Referencia</th>
                                    <th>Fecha</th>
                                    <th>Neto</th>
                                    <th>Estado</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="nomina : ${nominas}" class="ff-clickable-row" th:onclick="|location.href='@{/staff/nominas/{id}(id=${nomina.id})}'|">
                                    <td th:text="${nomina.periodo}">2026-04</td>
                                    <td class="text-muted" th:text="${nomina.referencia}">NOM-001</td>
                                    <td th:text="${nomina.fechaEmision != null ? #temporals.format(nomina.fechaEmision, 'dd/MM/yyyy') : '-'}">-</td>
                                    <td><strong th:text="${#numbers.formatDecimal(nomina.salarioNeto, 1, 'POINT', 2, 'COMMA')} + ' EUR'">0 EUR</strong></td>
                                    <td>
                                        <span class="badge rounded-pill"
                                              th:classappend="${nomina.estado.name() == 'PAGADA'} ? ' text-bg-success' : (${nomina.estado.name() == 'EMITIDA'} ? ' text-bg-warning' : ' text-bg-secondary')"
                                              th:text="${nomina.estado}">BORRADOR</span>
                                    </td>
                                    <td class="text-end ff-nowrap">
                                        <a class="btn btn-sm btn-outline-secondary"
                                           th:href="@{/staff/nominas/{id}(id=${nomina.id})}"
                                           onclick="event.stopPropagation()">Ver</a>
                                        <a class="btn btn-sm btn-outline-success"
                                           target="_blank"
                                           rel="noopener"
                                           th:href="@{/staff/nominas/{id}/pdf(id=${nomina.id})}"
                                           onclick="event.stopPropagation()">
                                            <i class="fa-solid fa-file-pdf"></i>
                                        </a>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(nominas)}">
                                    <td colspan="6">
                                        <div class="ff-empty-state">Aún no hay nóminas asociadas a tu perfil.</div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

                <div th:replace="~{fragments/footer :: footer}"></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
