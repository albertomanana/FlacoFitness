<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Formulario staff')}"></head>
<body class="ff-app">
<div class="ff-app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('staff')}"></div>

    <div class="ff-main">
        <div th:replace="~{fragments/topbar :: topbar(${modoEdicion} ? 'Editar staff' : 'Nuevo staff', 'Alta y mantenimiento del equipo interno.')}"></div>

        <main class="ff-content">
            <div class="ff-content-stack">
                <section class="ff-surface-card">
                    <div class="ff-card-body">
                        <form th:object="${staff}"
                              th:action="${modoEdicion} ? @{/staff/{id}(id=${staff.id})} : @{/staff}"
                              method="post">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label" for="usuario">Usuario</label>
                                    <select id="usuario" class="form-select" th:field="*{usuario.id}">
                                        <option value="">Seleccionar usuario</option>
                                        <option th:each="u : ${usuariosActivos}"
                                                th:value="${u.id}"
                                                th:text="${u.nombre + (u.apellidos != null && !u.apellidos.isBlank() ? ' ' + u.apellidos : '') + ' · ' + u.email}">Usuario</option>
                                    </select>
                                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('usuario')}" th:errors="*{usuario}">Error</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="rolStaff">Rol interno</label>
                                    <select id="rolStaff" class="form-select" th:field="*{rolStaff}">
                                        <option th:each="rol : ${rolesStaff}"
                                                th:value="${rol}"
                                                th:text="${#strings.replace(rol.name(), '_', ' ')}">Rol</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="especialidad">Especialidad</label>
                                    <input id="especialidad" class="form-control" type="text" th:field="*{especialidad}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" for="fechaAlta">Fecha alta</label>
                                    <input id="fechaAlta" class="form-control" type="date" th:field="*{fechaAlta}">
                                </div>
                                <div class="col-md-6">
                                    <div class="form-check form-switch mt-md-4 pt-md-2">
                                        <input id="puedeImpartirClases" class="form-check-input" type="checkbox" th:field="*{puedeImpartirClases}">
                                        <label class="form-check-label" for="puedeImpartirClases">Puede impartir clases</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-check form-switch mt-md-4 pt-md-2">
                                        <input id="activo" class="form-check-input" type="checkbox" th:field="*{activo}">
                                        <label class="form-check-label" for="activo">Activo</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" for="observaciones">Observaciones</label>
                                    <textarea id="observaciones" class="form-control" rows="3" th:field="*{observaciones}"></textarea>
                                </div>
                            </div>

                            <div class="ff-form-actions">
                                <div class="d-flex gap-2">
                                    <button class="btn btn-success" type="submit">Guardar</button>
                                    <a class="btn btn-outline-secondary" th:href="@{/staff}">Cancelar</a>
                                </div>
                            </div>
                        </form>
                    </div>
                </section>

                <div th:replace="~{fragments/footer :: footer}"></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
