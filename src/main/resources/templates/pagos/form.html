<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Formulario de pago')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="mb-4">
                <h1 class="mb-1" th:text="${modoEdicion} ? 'Editar pago' : 'Nuevo pago'">Formulario de pago</h1>
                <p class="text-muted mb-0">Registra la información principal del pago y su relación con usuario y plan.</p>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form th:object="${pago}"
                          th:action="${modoEdicion} ? @{/pagos/{id}(id=${pago.id})} : @{/pagos}"
                          method="post">
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
                            <div th:each="error : ${#fields.globalErrors()}" th:text="${error}">Error</div>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="fechaPago" class="form-label">Fecha de pago</label>
                                <input id="fechaPago" type="date" class="form-control" th:field="*{fechaPago}">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fechaPago')}"
                                     th:errors="*{fechaPago}">Error</div>
                            </div>
                            <div class="col-md-6">
                                <label for="monto" class="form-label">Monto</label>
                                <input id="monto" type="number" step="0.01" min="0.01" class="form-control"
                                       th:field="*{monto}" placeholder="39.99">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('monto')}"
                                     th:errors="*{monto}">Error</div>
                            </div>
                            <div class="col-md-6">
                                <label for="metodoPago" class="form-label">Método de pago</label>
                                <select id="metodoPago" class="form-select" th:field="*{metodoPago}">
                                    <option value="">Seleccionar método</option>
                                    <option th:each="metodo : ${metodosPago}" th:value="${metodo}"
                                            th:text="${#strings.replace(metodo.name(), '_', ' ')}">
                                        Método
                                    </option>
                                </select>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('metodoPago')}"
                                     th:errors="*{metodoPago}">Error</div>
                            </div>
                            <div class="col-md-6">
                                <label for="estado" class="form-label">Estado</label>
                                <select id="estado" class="form-select" th:field="*{estado}">
                                    <option value="">Seleccionar estado</option>
                                    <option th:each="estado : ${estadosPago}" th:value="${estado}"
                                            th:text="${#strings.replace(estado.name(), '_', ' ')}">
                                        Estado
                                    </option>
                                </select>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('estado')}"
                                     th:errors="*{estado}">Error</div>
                            </div>
                            <div class="col-md-6">
                                <label for="usuario" class="form-label">Usuario</label>
                                <select id="usuario" class="form-select" th:field="*{usuario.id}">
                                    <option value="">Seleccionar usuario</option>
                                    <option th:each="usuario : ${usuarios}" th:value="${usuario.id}"
                                            th:text="${usuario.nombre + (usuario.apellidos != null ? ' ' + usuario.apellidos : '')}">
                                        Usuario
                                    </option>
                                </select>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('usuario.id')}"
                                     th:errors="*{usuario.id}">Error</div>
                            </div>
                            <div class="col-md-6">
                                <label for="plan" class="form-label">Plan</label>
                                <select id="plan" class="form-select" th:field="*{plan.id}">
                                    <option value="">Sin plan asociado</option>
                                    <option th:each="plan : ${planes}" th:value="${plan.id}" th:text="${plan.nombre}">
                                        Plan
                                    </option>
                                </select>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('plan.id')}"
                                     th:errors="*{plan.id}">Error</div>
                            </div>
                            <div class="col-12">
                                <label for="referencia" class="form-label">Referencia</label>
                                <input id="referencia" type="text" class="form-control" th:field="*{referencia}"
                                       placeholder="REC-2026-0001">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('referencia')}"
                                     th:errors="*{referencia}">Error</div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-success">Guardar</button>
                            <a class="btn btn-outline-secondary" th:href="@{/pagos}">Volver</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
