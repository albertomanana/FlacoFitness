<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Pagos')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <h1 class="mb-1" th:text="${tituloListado ?: 'Pagos'}">Pagos</h1>
            <p class="text-muted mb-0"
               th:text="${subtituloListado ?: 'Gestión general de pagos registrados en el sistema.'}">
                Gestión general de pagos registrados en el sistema.
            </p>
        </div>
        <a class="btn btn-success" th:href="@{/pagos/nuevo}">Nuevo pago</a>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensajeExito}">Operación completada correctamente.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Fecha de pago</th>
                        <th>Usuario</th>
                        <th>Plan</th>
                        <th>Monto</th>
                        <th>Método</th>
                        <th>Estado</th>
                        <th>Referencia</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody th:if="${not #lists.isEmpty(pagos)}">
                    <tr th:each="pago : ${pagos}">
                        <td th:text="${pago.fechaPago != null ? #temporals.format(pago.fechaPago, 'dd/MM/yyyy') : '-'}">
                            Fecha
                        </td>
                        <td th:text="${pago.usuario != null ? pago.usuario.nombre + (pago.usuario.apellidos != null ? ' ' + pago.usuario.apellidos : '') : '-'}">
                            Usuario
                        </td>
                        <td th:text="${pago.plan != null ? pago.plan.nombre : '-'}">Plan</td>
                        <td th:text="${pago.monto != null ? pago.monto : '-'}">0.00</td>
                        <td th:text="${pago.metodoPago != null ? #strings.replace(pago.metodoPago.name(), '_', ' ') : '-'}">
                            Método
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${pago.estado != null && pago.estado.name() == 'PAGADO'} ? ' text-bg-success' : (${pago.estado != null && pago.estado.name() == 'VENCIDO'} ? ' text-bg-danger' : ' text-bg-warning')"
                                  th:text="${pago.estado != null ? #strings.replace(pago.estado.name(), '_', ' ') : '-'}">
                                Estado
                            </span>
                        </td>
                        <td th:text="${#strings.defaultString(pago.referencia, '-')}">Referencia</td>
                        <td class="text-end">
                            <div class="d-inline-flex gap-2 flex-wrap justify-content-end">
                                <a class="btn btn-outline-secondary btn-sm" th:href="@{/pagos/{id}(id=${pago.id})}">Ver</a>
                                <a class="btn btn-outline-success btn-sm" th:href="@{/pagos/{id}/editar(id=${pago.id})}">Editar</a>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                    <tbody th:if="${#lists.isEmpty(pagos)}">
                    <tr>
                        <td colspan="8" class="text-center text-muted py-4">
                            Todavía no hay pagos registrados.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
