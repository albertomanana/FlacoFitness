<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Detalle de pago')}"></head>
<body class="ff-app">
<div class="ff-app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('pagos')}"></div>

    <div class="ff-main">
        <div th:replace="~{fragments/topbar :: topbar('Detalle de pago', 'Detalle del cobro.')}"></div>

        <main class="ff-content">
            <div class="ff-content-stack">
                <section class="ff-section-header">
                    <div>
                        <span class="ff-section-eyebrow">Consulta</span>
                        <h2 class="ff-section-title">Pago registrado</h2>
                        <p class="ff-section-subtitle">Estado, importe y relacion.</p>
                    </div>
                    <div class="d-flex gap-2">
                        <a class="btn btn-success" th:href="@{/pagos/{id}/editar(id=${pago.id})}">Editar</a>
                        <a class="btn btn-outline-secondary" th:href="@{/pagos}">Volver</a>
                    </div>
                </section>

                <section class="row g-4 justify-content-center ff-detail-layout">
                    <div class="col-12 col-xl-8">
                        <article class="ff-surface-card">
                            <div class="ff-card-body d-flex flex-column gap-4">
                                <div class="ff-detail-hero">
                                    <div>
                                        <h3 class="ff-detail-hero-title">Detalle del cobro</h3>
                                        <p class="ff-detail-hero-text">Toda la informacion registrada sobre este pago.</p>
                                    </div>
                                    <span class="ff-status-badge"
                                          th:classappend="${pago.estado != null && pago.estado.name() == 'PAGADO'} ? ' ff-status-paid' : (${pago.estado != null && pago.estado.name() == 'VENCIDO'} ? ' ff-status-overdue' : ' ff-status-pending')"
                                          th:text="${pago.estado != null ? #strings.replace(pago.estado.name(), '_', ' ') : '-'}">
                                        Estado
                                    </span>
                                </div>

                                <div class="ff-detail-grid">
                                    <div class="ff-detail-item">
                                        <span class="ff-detail-label">Fecha de pago</span>
                                        <span class="ff-detail-value" th:text="${pago.fechaPago != null ? #temporals.format(pago.fechaPago, 'dd/MM/yyyy') : '-'}">Fecha</span>
                                    </div>
                                    <div class="ff-detail-item">
                                        <span class="ff-detail-label">Monto</span>
                                        <span class="ff-detail-value" th:text="${pago.monto != null ? #numbers.formatDecimal(pago.monto, 1, 'POINT', 2, 'COMMA') + ' €' : '-'}">0.00 €</span>
                                    </div>
                                    <div class="ff-detail-item">
                                        <span class="ff-detail-label">Metodo de pago</span>
                                        <span class="ff-detail-value"
                                              th:text="${pago.metodoPago != null ? #strings.replace(pago.metodoPago.name(), '_', ' ') : '-'}">Metodo</span>
                                    </div>
                                    <div class="ff-detail-item">
                                        <span class="ff-detail-label">Referencia</span>
                                        <span class="ff-detail-value" th:text="${#strings.defaultString(pago.referencia, '-')}">Referencia</span>
                                    </div>
                                    <div class="ff-detail-item">
                                        <span class="ff-detail-label">Usuario asociado</span>
                                        <span class="ff-detail-value">
                                            <a th:if="${pago.usuario != null}" th:href="@{/usuarios/{id}(id=${pago.usuario.id})}" th:text="${pago.usuario.nombre + (pago.usuario.apellidos != null ? ' ' + pago.usuario.apellidos : '')}">Usuario</a>
                                            <span th:unless="${pago.usuario != null}">-</span>
                                        </span>
                                    </div>
                                    <div class="ff-detail-item">
                                        <span class="ff-detail-label">Plan asociado</span>
                                        <span class="ff-detail-value" th:text="${pago.plan != null ? pago.plan.nombre : '-'}">Plan</span>
                                    </div>
                                </div>
                            </div>
                        </article>
                    </div>
                </section>

                <div th:replace="~{fragments/footer :: footer}"></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
