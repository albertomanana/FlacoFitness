<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Mis rutinas')}"></head>
<body class="ff-app-shell">
<div th:replace="~{fragments/sidebar :: sidebar('cliente-rutinas')}"></div>
<div class="ff-main">
    <div th:replace="~{fragments/topbar :: topbar(${tituloListado}, ${subtituloListado})}"></div>
    <main class="ff-content">
        <div class="ff-content-stack ff-page-stack">
            <div th:replace="~{fragments/alerts :: alerts(${mensajeExito}, ${mensajeError})}"></div>

            <section class="row g-4">
                <div class="col-12">
                    <article class="ff-surface-card">
                        <div class="ff-card-header">
                            <h2 class="ff-card-title" th:text="${tituloListado}">Listado</h2>
                            <p class="ff-card-subtitle" th:text="${subtituloListado}">Descripción</p>
                        </div>
                        <div class="ff-card-body">
                            <div th:if="${not #lists.isEmpty(rutinas)}">
                                <div class="table-responsive">
                                    <table class="table ff-table">
                                        <thead>
                                            <tr>
                                                <th>Nombre</th>
                                                <th>Tipo</th>
                                                <th>Estado</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="rutina : ${rutinas}">
                                                <td><strong th:text="${rutina.nombre}">Rutina</strong></td>
                                                <td th:text="${rutina.tipoRutina != null} ? ${rutina.tipoRutina} : 'GENERAL'">Tipo</td>
                                                <td><span class="badge rounded-pill" th:classappend="${rutina.activa} ? ' text-bg-success' : ' text-bg-secondary'" th:text="${rutina.activa} ? 'Activa' : 'Inactiva'">Estado</span></td>
                                                <td class="text-end">
                                                    <a th:href="@{/cliente/rutinas/{id}(id=${rutina.id})}" class="btn btn-sm btn-outline-secondary">
                                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                            <polyline points="9 18 15 12 9 6"/>
                                                        </svg>
                                                        Ver
                                                    </a>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <p class="ff-empty-state" th:if="${#lists.isEmpty(rutinas)}">No tienes rutinas asignadas aún.</p>
                        </div>
                    </article>
                </div>
            </section>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
<script src="/js/cliente-panel.js"></script>
</body>
</html>
