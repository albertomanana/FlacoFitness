<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Detalle maquina')}"></head>
<body class="ff-app">
<div class="ff-app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('maquinas')}"></div>
    <div class="ff-main">
        <div th:replace="~{fragments/topbar :: topbar('Detalle de maquina', 'Estado operativo y mantenimiento.')}"></div>
        <main class="ff-content">
            <div class="ff-content-stack">
                <section class="ff-section-header ff-animate-in">
                    <div><span class="ff-section-eyebrow">Operacion</span><h2 class="ff-section-title" th:text="${maquina.nombre}">Detalle</h2></div>
                    <div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/maquinas}">Volver</a><a class="btn btn-success" th:href="@{/maquinas/{id}/editar(id=${maquina.id})}">Editar</a></div>
                </section>
                <section class="row g-3 ff-animate-in">
                    <div class="col-xl-4"><article class="ff-surface-card h-100"><div class="ff-card-body"><img class="img-fluid rounded border" th:src="${@userPhotoUrlResolver.resolvePhotoUrl(maquina.fotoPath)}" alt="Foto maquina"></div></article></div>
                    <div class="col-xl-8"><article class="ff-surface-card h-100"><div class="ff-card-body"><div class="row g-3"><div class="col-md-6"><strong>Categoria:</strong> <span th:text="${maquina.categoria != null ? #strings.replace(maquina.categoria.name(), '_', ' ') : '-'}">-</span></div><div class="col-md-6"><strong>Estado:</strong> <span th:text="${maquina.estado != null ? #strings.replace(maquina.estado.name(), '_', ' ') : '-'}">-</span></div><div class="col-md-6"><strong>Marca:</strong> <span th:text="${#strings.defaultString(maquina.marca, '-')}">-</span></div><div class="col-md-6"><strong>Modelo:</strong> <span th:text="${#strings.defaultString(maquina.modelo, '-')}">-</span></div><div class="col-md-6"><strong>Serie:</strong> <span th:text="${#strings.defaultString(maquina.numeroSerie, '-')}">-</span></div><div class="col-md-6"><strong>Ubicacion:</strong> <span th:text="${#strings.defaultString(maquina.ubicacion, '-')}">-</span></div><div class="col-md-6"><strong>Fecha compra:</strong> <span th:text="${maquina.fechaCompra != null ? #temporals.format(maquina.fechaCompra, 'dd/MM/yyyy') : '-'}">-</span></div><div class="col-md-6"><strong>Ultima revision:</strong> <span th:text="${maquina.ultimaRevision != null ? #temporals.format(maquina.ultimaRevision, 'dd/MM/yyyy') : '-'}">-</span></div><div class="col-md-6"><strong>Proxima revision:</strong> <span th:text="${maquina.proximaRevision != null ? #temporals.format(maquina.proximaRevision, 'dd/MM/yyyy') : '-'}">-</span></div><div class="col-12"><strong>Observaciones:</strong><p class="mb-0" th:text="${#strings.defaultString(maquina.observaciones, 'Sin observaciones')}">Sin observaciones</p></div></div></div></article></div>
                </section>
                <div th:replace="~{fragments/footer :: footer}"></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
