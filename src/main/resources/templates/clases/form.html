<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Clase')}"></head>
<body class="ff-app">
<div class="ff-app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('clases')}"></div>
    <div class="ff-main">
        <div th:replace="~{fragments/topbar :: topbar('Clase', 'Actividad base para sesiones.')}"></div>
        <main class="ff-content">
            <div class="ff-content-stack">
                <section class="ff-section-header"><div><span class="ff-section-eyebrow">Clases</span><h2 class="ff-section-title" th:text="${modoEdicion ? 'Editar clase' : 'Crear clase'}">Crear clase</h2><p class="ff-section-subtitle">Una clase es la actividad base; la sesion es el horario concreto.</p></div><a class="btn btn-outline-secondary" th:href="@{/clases}">Volver</a></section>
                <form class="ff-surface-card" th:object="${clase}" th:action="${modoEdicion ? '/clases/' + clase.id : '/clases'}" method="post">
                    <div class="ff-card-body"><div class="row g-3"><div class="col-md-8"><label class="form-label" for="nombre">Nombre</label><input id="nombre" class="form-control" th:field="*{nombre}"><div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div></div><div class="col-md-4"><label class="form-label" for="capacidadSugerida">Aforo sugerido</label><input id="capacidadSugerida" type="number" min="1" class="form-control" th:field="*{capacidadSugerida}"></div><div class="col-md-4 d-flex align-items-end"><div class="form-check form-switch mb-2"><input id="activa" type="checkbox" class="form-check-input" th:field="*{activa}"><label class="form-check-label" for="activa">Activa</label></div></div><div class="col-12"><label class="form-label" for="descripcion">Descripcion</label><textarea id="descripcion" rows="3" class="form-control" th:field="*{descripcion}"></textarea></div><div class="col-12"><label class="form-label" for="observaciones">Observaciones</label><textarea id="observaciones" rows="3" class="form-control" th:field="*{observaciones}"></textarea></div></div></div>
                    <div class="ff-form-actions"><p class="ff-form-actions-note">Despues podras programar sesiones con fecha, hora y staff.</p><div class="d-flex gap-2"><button class="btn btn-success" type="submit">Guardar</button><a class="btn btn-outline-secondary" th:href="@{/clases}">Cancelar</a></div></div>
                </form>
                <div th:replace="~{fragments/footer :: footer}"></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
