<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Detalle clase')}"></head>
<body class="ff-app">
<div class="ff-app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('clases')}"></div>
    <div class="ff-main">
        <div th:replace="~{fragments/topbar :: topbar('Detalle clase', 'Actividad base.')}"></div>
        <main class="ff-content">
            <div class="ff-content-stack">
                <section class="ff-section-header"><div><span class="ff-section-eyebrow">Clase</span><h2 class="ff-section-title" th:text="${clase.nombre}">Clase</h2><p class="ff-section-subtitle" th:text="${#strings.defaultString(clase.descripcion, 'Actividad programable')}">Actividad</p></div><div class="d-flex gap-2"><a class="btn btn-outline-secondary" th:href="@{/clases}">Volver</a><a class="btn btn-success" th:href="@{/clases/{id}/editar(id=${clase.id})}">Editar</a><a class="btn btn-outline-success" th:href="@{/sesiones/nueva}">Programar sesion</a></div></section>
                <article class="ff-surface-card"><div class="ff-card-header"><h3 class="ff-card-title">Datos</h3></div><div class="ff-card-body"><div class="ff-detail-grid"><div class="ff-detail-item"><span>Aforo sugerido</span><strong th:text="${clase.capacidadSugerida != null ? clase.capacidadSugerida + ' plazas' : '-'}">12</strong></div><div class="ff-detail-item"><span>Estado</span><strong th:text="${clase.activa == true ? 'Activa' : 'Inactiva'}">Activa</strong></div><div class="ff-detail-item ff-detail-item-wide"><span>Observaciones</span><strong th:text="${#strings.defaultString(clase.observaciones, '-')}">obs</strong></div></div></div></article>
                <div th:replace="~{fragments/footer :: footer}"></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
