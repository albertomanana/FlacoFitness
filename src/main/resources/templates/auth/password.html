<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cambiar contraseña')}"></head>
<body class="ff-access-page">
<main class="ff-access-shell ff-access-shell-premium">
    <section class="ff-access-card ff-access-card-auth ff-animate-in">
        <div class="ff-access-hero">
            <a class="ff-error-brand" th:href="@{/}" aria-label="Ir al dashboard">
                <img th:src="@{/img/logo.svg}" alt="FlacoFitness">
            </a>
            <span class="ff-access-badge" th:text="${mustChangePassword} ? 'Accion requerida' : 'Cuenta'}">Cuenta</span>
            <h1 class="ff-access-title" th:text="${mustChangePassword} ? 'Cambia tu contraseña temporal' : 'Actualizar contraseña'}">Actualizar contraseña</h1>
            <p class="ff-access-message">
                Usa una contraseña robusta y facil de recordar para ti. La cuenta mantendra el mismo rol y los mismos permisos.
            </p>
        </div>

        <div class="ff-access-form">
            <div th:replace="~{fragments/alerts :: alerts(${mensajeExito}, ${mensajeError})}"></div>
            <form th:action="@{/cuenta/password}" th:object="${passwordForm}" method="post" class="vstack gap-3">
                <div>
                    <label for="currentPassword" class="form-label fw-semibold">Contraseña actual</label>
                    <div class="ff-password-field">
                        <input id="currentPassword"
                               type="password"
                               class="form-control form-control-lg"
                               th:field="*{currentPassword}"
                               autocomplete="current-password"
                               data-password-input>
                        <button class="ff-password-toggle" type="button" aria-label="Mostrar contraseña" data-password-toggle>
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label for="newPassword" class="form-label fw-semibold">Nueva contraseña</label>
                    <div class="ff-password-field">
                        <input id="newPassword"
                               type="password"
                               class="form-control form-control-lg"
                               th:field="*{newPassword}"
                               autocomplete="new-password"
                               data-password-input>
                        <button class="ff-password-toggle" type="button" aria-label="Mostrar contraseña" data-password-toggle>
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <div class="form-text">Minimo 8 caracteres. Recomendado: mezcla de letras, numeros y simbolos.</div>
                </div>
                <div>
                    <label for="confirmPassword" class="form-label fw-semibold">Confirmar nueva contraseña</label>
                    <div class="ff-password-field">
                        <input id="confirmPassword"
                               type="password"
                               class="form-control form-control-lg"
                               th:field="*{confirmPassword}"
                               autocomplete="new-password"
                               data-password-input>
                        <button class="ff-password-toggle" type="button" aria-label="Mostrar contraseña" data-password-toggle>
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button class="btn btn-success btn-lg w-100" type="submit">Guardar nueva contraseña</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
