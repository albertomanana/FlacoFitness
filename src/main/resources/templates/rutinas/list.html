<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Rutinas')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <h1 class="mb-1">Rutinas</h1>
            <p class="text-muted mb-0">Gestión de rutinas de entrenamiento asignadas a usuarios.</p>
        </div>
        <a class="btn btn-success" th:href="@{/rutinas/nueva}">Nueva rutina</a>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensajeExito}">Operación completada correctamente.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Objetivo</th>
                        <th>Usuario</th>
                        <th>Fecha de creación</th>
                        <th>Activa</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody th:if="${not #lists.isEmpty(rutinas)}">
                    <tr th:each="rutina : ${rutinas}">
                        <td th:text="${rutina.nombre}">Nombre</td>
                        <td th:text="${#strings.replace(rutina.objetivo.name(), '_', ' ')}">Objetivo</td>
                        <td th:text="${rutina.usuario != null ? rutina.usuario.nombre : '-'}">Usuario</td>
                        <td th:text="${rutina.fechaCreacion != null ? #temporals.format(rutina.fechaCreacion, 'dd/MM/yyyy HH:mm') : '-'}">
                            Fecha
                        </td>
                        <td>
                            <span th:if="${rutina.activa}" class="badge text-bg-success">Sí</span>
                            <span th:unless="${rutina.activa}" class="badge text-bg-secondary">No</span>
                        </td>
                        <td class="text-end">
                            <div class="d-inline-flex gap-2 flex-wrap justify-content-end">
                                <a class="btn btn-outline-secondary btn-sm"
                                   th:href="@{/rutinas/{id}(id=${rutina.id})}">
                                    Ver
                                </a>
                                <a class="btn btn-outline-success btn-sm"
                                   th:href="@{/rutinas/{id}/editar(id=${rutina.id})}">
                                    Editar
                                </a>
                                <form th:if="${rutina.activa}" th:action="@{/rutinas/{id}/desactivar(id=${rutina.id})}"
                                      method="post" class="d-inline">
                                    <button type="submit" class="btn btn-outline-danger btn-sm"
                                            onclick="return confirm('¿Deseas desactivar esta rutina?');">
                                        Desactivar
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                    <tbody th:if="${#lists.isEmpty(rutinas)}">
                    <tr>
                        <td colspan="6" class="text-center text-muted py-4">
                            Todavía no hay rutinas registradas.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
