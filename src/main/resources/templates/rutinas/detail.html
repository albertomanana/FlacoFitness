<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Detalle de rutina')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1">Detalle de rutina</h1>
            <p class="text-muted mb-0">Ficha base para la futura vista detallada de una rutina.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/rutinas}">Volver al listado</a>
    </div>

    <div class="row g-4">
        <div class="col-lg-5">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <h2 class="h5">Resumen</h2>
                    <p class="text-muted mb-0">Los datos específicos se incorporarán al conectar el dominio real.</p>
                </div>
            </div>
        </div>
        <div class="col-lg-7">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body">
                    <h2 class="h5">Ejercicios asociados</h2>
                    <p class="text-muted mb-0">Se mostrará aquí la composición de `RutinaEjercicio`.</p>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
