<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Detalle de asistencia')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="mb-1">Detalle de asistencia</h1>
            <p class="text-muted mb-0">Consulta completa del registro seleccionado.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/asistencias}">Volver</a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <dl class="row mb-0">
                <dt class="col-sm-3">Fecha</dt>
                <dd class="col-sm-9" th:text="${asistencia.fecha != null ? #temporals.format(asistencia.fecha, 'dd/MM/yyyy') : '-'}">
                    Fecha
                </dd>

                <dt class="col-sm-3">Hora de entrada</dt>
                <dd class="col-sm-9" th:text="${asistencia.horaEntrada != null ? #temporals.format(asistencia.horaEntrada, 'HH:mm') : '-'}">
                    Hora
                </dd>

                <dt class="col-sm-3">Usuario</dt>
                <dd class="col-sm-9"
                    th:text="${asistencia.usuario != null ? asistencia.usuario.nombre + (asistencia.usuario.apellidos != null ? ' ' + asistencia.usuario.apellidos : '') : '-'}">
                    Usuario
                </dd>

                <dt class="col-sm-3">Observaciones</dt>
                <dd class="col-sm-9" th:text="${#strings.defaultString(asistencia.observaciones, '-')}">Observaciones</dd>
            </dl>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
