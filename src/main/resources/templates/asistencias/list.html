<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Asistencias')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <h1 class="mb-1" th:text="${tituloListado ?: 'Asistencias'}">Asistencias</h1>
            <p class="text-muted mb-0"
               th:text="${subtituloListado ?: 'Registro general de asistencias del gimnasio.'}">
                Registro general de asistencias del gimnasio.
            </p>
        </div>
        <a class="btn btn-success" th:href="@{/asistencias/nueva}">Nueva asistencia</a>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${mensajeExito}">Operación completada correctamente.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Hora de entrada</th>
                        <th>Usuario</th>
                        <th>Observaciones</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody th:if="${not #lists.isEmpty(asistencias)}">
                    <tr th:each="asistencia : ${asistencias}">
                        <td th:text="${asistencia.fecha != null ? #temporals.format(asistencia.fecha, 'dd/MM/yyyy') : '-'}">Fecha</td>
                        <td th:text="${asistencia.horaEntrada != null ? #temporals.format(asistencia.horaEntrada, 'HH:mm') : '-'}">Hora</td>
                        <td th:text="${asistencia.usuario != null ? asistencia.usuario.nombre + (asistencia.usuario.apellidos != null ? ' ' + asistencia.usuario.apellidos : '') : '-'}">
                            Usuario
                        </td>
                        <td th:text="${#strings.defaultString(asistencia.observaciones, '-')}">Observaciones</td>
                        <td class="text-end">
                            <a class="btn btn-outline-secondary btn-sm"
                               th:href="@{/asistencias/{id}(id=${asistencia.id})}">Ver</a>
                        </td>
                    </tr>
                    </tbody>
                    <tbody th:if="${#lists.isEmpty(asistencias)}">
                    <tr>
                        <td colspan="5" class="text-center text-muted py-4">
                            Todavía no hay asistencias registradas.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
