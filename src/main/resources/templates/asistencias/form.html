<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Formulario de asistencia')}"></head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="mb-4">
                <h1 class="mb-1">Nueva asistencia</h1>
                <p class="text-muted mb-0">Registra la entrada de un usuario al gimnasio.</p>
            </div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form th:object="${asistencia}" th:action="@{/asistencias}" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="fecha" class="form-label">Fecha</label>
                                <input id="fecha" type="date" class="form-control" th:field="*{fecha}">
                                <div class="form-text">Si se deja vacío, se registrará la fecha actual.</div>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fecha')}"
                                     th:errors="*{fecha}">Error</div>
                            </div>
                            <div class="col-md-6">
                                <label for="horaEntrada" class="form-label">Hora de entrada</label>
                                <input id="horaEntrada" type="time" class="form-control" th:field="*{horaEntrada}">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('horaEntrada')}"
                                     th:errors="*{horaEntrada}">Error</div>
                            </div>
                            <div class="col-12">
                                <label for="usuario" class="form-label">Usuario</label>
                                <select id="usuario" class="form-select" th:field="*{usuario.id}">
                                    <option value="">Seleccionar usuario</option>
                                    <option th:each="usuario : ${usuarios}" th:value="${usuario.id}"
                                            th:text="${usuario.nombre + (usuario.apellidos != null ? ' ' + usuario.apellidos : '')}">
                                        Usuario
                                    </option>
                                </select>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('usuario.id')}"
                                     th:errors="*{usuario.id}">Error</div>
                            </div>
                            <div class="col-12">
                                <label for="observaciones" class="form-label">Observaciones</label>
                                <textarea id="observaciones" class="form-control" rows="4" th:field="*{observaciones}"
                                          placeholder="Notas opcionales sobre la asistencia"></textarea>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('observaciones')}"
                                     th:errors="*{observaciones}">Error</div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <button type="submit" class="btn btn-success">Guardar</button>
                            <a class="btn btn-outline-secondary" th:href="@{/asistencias}">Volver</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
