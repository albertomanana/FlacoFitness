<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Sesion')}"></head>
<body class="ff-app">
<div class="ff-app-shell">
    <div th:replace="~{fragments/sidebar :: sidebar('sesiones')}"></div>
    <div class="ff-main">
        <div th:replace="~{fragments/topbar :: topbar('Sesion', 'Horario operativo.')}"></div>
        <main class="ff-content">
            <div class="ff-content-stack">
                <section class="ff-section-header"><div><span class="ff-section-eyebrow">Sesiones</span><h2 class="ff-section-title" th:text="${modoEdicion ? 'Editar horario' : 'Programar horario'}">Programar</h2><p class="ff-section-subtitle">Relaciona clase, staff, cupo y rutina opcional.</p></div><a class="btn btn-outline-secondary" th:href="@{/sesiones}">Volver</a></section>
                <form class="ff-surface-card" th:object="${sesionClase}" th:action="${modoEdicion ? '/sesiones/' + sesionClase.id : '/sesiones'}" method="post">
                    <div class="ff-card-body">
                        <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" th:each="err : ${#fields.globalErrors()}" th:text="${err}">Error</div>
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label" for="clase">Clase</label><select id="clase" class="form-select" th:field="*{clase.id}"><option value="">Seleccionar clase</option><option th:each="clase : ${clases}" th:value="${clase.id}" th:text="${clase.nombre}">Clase</option></select></div>
                            <div class="col-md-6"><label class="form-label" for="staff">Staff responsable</label><select id="staff" class="form-select" th:field="*{staffResponsable.id}"><option value="">Sin asignar</option><option th:each="perfil : ${staffActivos}" th:value="${perfil.id}" th:text="${perfil.usuario != null ? perfil.usuario.nombre + (perfil.usuario.apellidos != null && !perfil.usuario.apellidos.isBlank() ? ' ' + perfil.usuario.apellidos : '') : 'Staff'}">Staff</option></select></div>
                            <div class="col-md-4"><label class="form-label" for="fecha">Fecha</label><input id="fecha" type="date" class="form-control" th:field="*{fecha}"></div>
                            <div class="col-md-4"><label class="form-label" for="horaInicio">Hora inicio</label><input id="horaInicio" type="time" class="form-control" th:field="*{horaInicio}"></div>
                            <div class="col-md-4"><label class="form-label" for="horaFin">Hora fin</label><input id="horaFin" type="time" class="form-control" th:field="*{horaFin}"></div>
                            <div class="col-md-4"><label class="form-label" for="aforo">Aforo</label><input id="aforo" type="number" min="1" class="form-control" th:field="*{aforo}"></div>
                            <div class="col-md-4"><label class="form-label" for="estado">Estado</label><select id="estado" class="form-select" th:field="*{estado}"><option th:each="estado : ${estadosSesion}" th:value="${estado}" th:text="${#strings.replace(estado.name(), '_', ' ')}">Estado</option></select></div>
                            <div class="col-md-4"><label class="form-label" for="rutina">Rutina opcional</label><select id="rutina" class="form-select" th:field="*{rutina.id}"><option value="">Sin rutina</option><option th:each="rutina : ${rutinas}" th:value="${rutina.id}" th:text="${rutina.nombre}">Rutina</option></select></div>
                            <div class="col-12"><label class="form-label" for="observaciones">Observaciones</label><textarea id="observaciones" rows="4" class="form-control" th:field="*{observaciones}"></textarea></div>
                        </div>
                    </div>
                    <div class="ff-form-actions"><p class="ff-form-actions-note">La sesion es la unidad operativa para reservas y asistencias de clase.</p><div class="d-flex gap-2"><button class="btn btn-success" type="submit">Guardar</button><a class="btn btn-outline-secondary" th:href="@{/sesiones}">Cancelar</a></div></div>
                </form>
                <div th:replace="~{fragments/footer :: footer}"></div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
