# ──────────────────────────────────────────────────────────────────────────────
# FlacoFitness — Perfil LOCAL (MySQL / XAMPP)
# Activo cuando: spring.profiles.active=local  (valor por defecto)
# Base de datos: flacofitness en MySQL (puerto 3306, credenciales XAMPP)
# ──────────────────────────────────────────────────────────────────────────────

# Datasource — MySQL local (XAMPP root sin contraseña)
spring.datasource.url=jdbc:mysql://localhost:3306/flacofitness?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate — update conserva esquema existente sin borrar datos
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.defer-datasource-initialization=true

# SQL seed — ejecuta data.sql al arrancar solo si las tablas ya existen (idempotente)
# Todos los INSERTs usan WHERE NOT EXISTS para no duplicar datos.
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql

# Modo demo activo
app.data.mode=local-demo
