# -----------------------------------------------------------------------------
# FlacoFitness - Perfil LOCAL (MySQL / XAMPP)
# Activo cuando: spring.profiles.active=local (valor por defecto)
# Base de datos: flacofitness en MySQL, puerto 3306.
# -----------------------------------------------------------------------------

# Datasource - MySQL local.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flacofitness?useSSL=false&serverTimezone=Europe/Madrid&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:flaco_user}
spring.datasource.password=${DB_PASSWORD:flaco_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate - update conserva esquema existente sin borrar datos.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Madrid
spring.jpa.defer-datasource-initialization=true

# SQL seed - desactivado en MySQL local para no romper datos reales.
spring.sql.init.mode=never

# Modo de datos real.
app.data.mode=mysql-real

# Seeder JDBC legacy desactivado para evitar incompatibilidades con esquemas MySQL existentes.
app.demo-seeder.enabled=false
