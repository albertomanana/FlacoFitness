spring.application.name=FlacoFitness
server.port=${SERVER_PORT:8080}

# Configuracion de base de datos
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:flacofitness}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:flaco_user}
spring.datasource.password=${DB_PASSWORD:flaco_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Thymeleaf
spring.thymeleaf.cache=false

# Inicializacion SQL
spring.sql.init.mode=never

# Errores
server.error.whitelabel.enabled=false
