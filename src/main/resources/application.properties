spring.application.name=FlacoFitness
spring.profiles.active=local
server.port=8080
upload.dir=uploads/
upload.max-image-size=5MB
app.data.mode=mysql-real

# Configuracion de base de datos MySQL
# Para entornos locales con XAMPP suele funcionar `root` sin password.
# Si usas otras credenciales, define DB_USERNAME y DB_PASSWORD en tu entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flacofitness?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=10000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.defer-datasource-initialization=true

# Thymeleaf
spring.thymeleaf.cache=false

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Pagos automaticos
app.pagos.scheduler.enabled=${APP_PAGOS_SCHEDULER_ENABLED:true}
app.pagos.scheduler.cron=${APP_PAGOS_SCHEDULER_CRON:0 0 3 * * *}

# Acceso PIN
app.access.pin=${APP_ACCESS_PIN:2468}
app.access.max-attempts=${APP_ACCESS_MAX_ATTEMPTS:3}
app.access.lock-minutes=${APP_ACCESS_LOCK_MINUTES:5}

# Inicializacion SQL
# Importante (defensa academica): por defecto NO sembrar datos en MySQL real.
# El sembrado demo queda restringido al perfil `local` (H2) mediante `data-local.sql`.
spring.sql.init.mode=never

# Errores
server.error.whitelabel.enabled=false
