spring.application.name=FlacoFitness
server.port=8080

# Configuracion de base de datos MySQL
# Para entornos locales con XAMPP suele funcionar `root` sin password.
# Si usas otras credenciales, define DB_USERNAME y DB_PASSWORD en tu entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flacofitness?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=10000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.defer-datasource-initialization=true

# Thymeleaf
spring.thymeleaf.cache=false

# Inicializacion SQL
spring.sql.init.mode=always

# Errores
server.error.whitelabel.enabled=false
