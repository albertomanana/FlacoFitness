spring.application.name=FlacoFitness
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
server.port=8080
upload.dir=uploads/
upload.max-image-size=5MB
app.data.mode=mysql-real

# Configuracion de base de datos MySQL/phpMyAdmin.
# La app no usa bases en memoria ni fallbacks: todos los datos viven en la base flacofitness.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flacofitness?useSSL=false&serverTimezone=Europe/Madrid&useUnicode=true&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:flaco_user}
spring.datasource.password=${DB_PASSWORD:flaco_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=10000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Madrid
spring.jpa.defer-datasource-initialization=true

# Thymeleaf
spring.thymeleaf.cache=false

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Pagos automaticos
app.pagos.scheduler.enabled=${APP_PAGOS_SCHEDULER_ENABLED:true}
app.pagos.scheduler.cron=${APP_PAGOS_SCHEDULER_CRON:0 0 3 * * *}

# Autenticacion por cuenta
app.auth.max-attempts=${APP_AUTH_MAX_ATTEMPTS:5}
app.auth.lock-minutes=${APP_AUTH_LOCK_MINUTES:1}
app.auth.bootstrap-password=${APP_AUTH_BOOTSTRAP_PASSWORD:FlacoTemp2026!}

# Inteligencia de producto
app.product.risk-days=${APP_PRODUCT_RISK_DAYS:14}
app.product.inactive-days=${APP_PRODUCT_INACTIVE_DAYS:30}
app.product.membership-expiring-days=${APP_PRODUCT_MEMBERSHIP_EXPIRING_DAYS:7}
app.product.machine-review-days=${APP_PRODUCT_MACHINE_REVIEW_DAYS:7}
app.product.expense-anomaly-factor=${APP_PRODUCT_EXPENSE_ANOMALY_FACTOR:1.5}

# Inicializacion SQL
# En MySQL real no ejecutar seeds automaticamente para evitar choques con datos legacy.
spring.sql.init.mode=never

# Errores
server.error.whitelabel.enabled=false
